name: Check upstream updates

on:
  schedule:
    - cron: '20 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/upstream-updates.yml']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: upstream-update-pr
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'WilliamGomes41/stitch-skills'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or reuse upstream update PR
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const head = 'google-labs-code:main';
            const { data: upstream } = await github.rest.repos.getCommit({
              owner: 'google-labs-code', repo: 'stitch-skills', ref: 'main',
            });
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `main...${upstream.sha}`,
            });
            if (comparison.ahead_by === 0) {
              core.notice('No new upstream commits.');
              return;
            }
            const { data: existing } = await github.rest.pulls.list({
              owner, repo, state: 'open', base: 'main', head,
            });
            if (existing.length) {
              core.notice(`Update PR already open: ${existing[0].html_url}`);
              return;
            }
            const { data: pr } = await github.rest.pulls.create({
              owner, repo, base: 'main', head,
              title: 'Update Stitch skills from google-labs-code',
              body: [
                'New commits are available from google-labs-code/stitch-skills.',
                '',
                `Compared upstream head: ${upstream.sha}`,
                `New upstream commits: ${comparison.ahead_by}`,
                '',
                'Review the changes, licenses and validation results before merging.',
                'This PR tracks upstream main and may receive further upstream commits.',
                'The fork is never reset or force-pushed by this workflow.',
                'After merging, refresh the marketplace and reinstall the chosen plugins',
                'as described in FORK.md. Installed copies do not update automatically.',
              ].join('\n'),
            });
            core.notice(`Created update PR: ${pr.html_url}`);
